    <noscript>
      <div style="max-width: 62ch; margin: 12vh auto; padding: 0 24px; line-height: 1.65">
        <h1>ARVEN — A Private Alpine Reserve</h1>
        <p>
          Four thousand hectares above Val d'Hérens in the Valais, between 1,780 and 3,240
          metres. Twenty-two residences at the treeline: eight at Le Refuge and fourteen
          private homesites on the ridge shoulder, sited so that no two are within sight of
          one another.
        </p>
        <p>
          Six named places inside the boundary: Le Refuge, La Cembraie, Lac Noir, L'Arête,
          L'Observatoire and Les Caches. Four birds define it — the spotted nutcracker that
          planted the arolla forest, the reintroduced bearded vulture, the alpine chough and
          a single resident pair of golden eagles.
        </p>
        <p>
          The interactive model of the reserve needs JavaScript. Written enquiries:
          <a href="mailto:enquiries@arven-apar.life">enquiries@arven-apar.life</a>.
        </p>
        <p>
          <small
            >ARVEN is a fictional estate built as a design demonstration. The natural history
            is accurate; the property is not real.</small
          >
        </p>
      </div>
